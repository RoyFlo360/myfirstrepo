name: Test Suite

on:
  push:
    branches: [ master, main, dev, qa ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - unit
        - integration
        - selenium

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout main repository
      uses: actions/checkout@v4
      
    - name: Run Ephemeral Tests
      id: ephemeral-tests
      uses: RoyFlo360/ephemeral_poc@main
      with:
        test-type: ${{ github.event.inputs.test_type || 'all' }}
        timeout: '600'
        working-directory: '.'
        upload-results: 'true'
        
    - name: Check Test Results
      if: steps.ephemeral-tests.outputs.success != 'true'
      run: |
        echo "❌ Tests failed!"
        echo "Logs: ${{ steps.ephemeral-tests.outputs.logs }}"
        exit 1
        
    - name: Success Message
      if: steps.ephemeral-tests.outputs.success == 'true'
      run: |
        echo "✅ All tests passed successfully!"
        echo "Logs: ${{ steps.ephemeral-tests.outputs.logs }}"
